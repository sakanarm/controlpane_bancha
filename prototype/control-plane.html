<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bancha Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sidebar (after the BO Conversion screen) beside a white work area in Arak's look (OpenMetadata ui-core-components: Inter, gray scale, brand blue #1570ef) */
:root{
  --hdr:#0b1b55; --hdr-card:#15276a; --hdr-card-hover:#1c3080; --hdr-active:#283c8f; --hdr-fg:#ffffff; --hdr-muted:#b4bfe6; --hdr-line:rgba(255,255,255,.24);
  --mint:#c9f0d6; --mint-fg:#0f5e33; --amber:#ffd79a; --amber-fg:#6b3b00; --rose:#ffc9c3; --rose-fg:#7a1a12;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f9fafb; --hover:#f9fafb; --line:#eaecf0; --line-strong:#d0d5dd;
  --fg:#101828; --fg-2:#344054; --muted:#475467; --faint:#98a2b3;
  --accent:#1570ef; --accent-fg:#ffffff; --accent-soft:#eff8ff; --accent-hover:#175cd3; --accent-line:#b2ddff; --accent-text:#175cd3; --accent-ring:#84caff;
  --ok:#079455; --ok-soft:#ecfdf3; --ok-line:#abefc6; --ok-text:#067647;
  --warn:#dc6803; --warn-soft:#fffaeb; --warn-line:#fedf89; --warn-text:#b54708;
  --bad:#d92d20; --bad-soft:#fef3f2; --bad-line:#fecdca; --bad-text:#b42318;
  --xs:0 1px 2px rgba(16,24,40,.05); --ring:0 0 0 4px rgba(21,112,239,.14);
  --c-arak:#3157e0; --c-prajak:#0f8f84; --c-openmetadata:#7348e0; --c-likit:#c27100; --c-bancha:#0b1b55;
  --code-bg:#0f1838; --code-fg:#dfe6ff; --code-key:#9fb4ff; --code-str:#9be2bb;
  --scrim:rgba(8,14,40,.48);
  --shadow:0 1px 3px rgba(16,24,40,.1), 0 1px 2px rgba(16,24,40,.06);
  --font:"Inter","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --hdr:#070f2e; --hdr-card:#101c4a; --hdr-card-hover:#16255c; --hdr-active:#1f3278; --hdr-fg:#ffffff; --hdr-muted:#a9b4dc; --hdr-line:rgba(255,255,255,.2);
  --mint:#1f5136; --mint-fg:#c4f3d5; --amber:#4d3410; --amber-fg:#ffd79a; --rose:#4d1b17; --rose-fg:#ffc9c3;
  --bg:#0c111d; --surface:#161b26; --surface-2:#1f242f; --hover:#1f242f; --line:#333741; --line-strong:#4b505c;
  --fg:#f5f5f6; --fg-2:#cecfd2; --muted:#94969c; --faint:#61646c;
  --accent:#2e90fa; --accent-fg:#ffffff; --accent-soft:#102a56; --accent-hover:#1570ef; --accent-line:#194185; --accent-text:#84caff; --accent-ring:#2e90fa;
  --ok:#17b26a; --ok-soft:#053321; --ok-line:#085d3a; --ok-text:#75e0a7;
  --warn:#f79009; --warn-soft:#4e1d09; --warn-line:#93370d; --warn-text:#fec84b;
  --bad:#f04438; --bad-soft:#55160c; --bad-line:#912018; --bad-text:#fda29b;
  --xs:0 1px 2px rgba(0,0,0,.3); --ring:0 0 0 4px rgba(46,144,250,.24);
  --c-arak:#7b93ff; --c-prajak:#3cc4b7; --c-openmetadata:#a58bff; --c-likit:#f0a43c; --c-bancha:#c9d3ff;
  --code-bg:#070c1f; --code-fg:#dfe6ff; --code-key:#9fb4ff; --code-str:#9be2bb;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --hdr:#070f2e; --hdr-card:#101c4a; --hdr-card-hover:#16255c; --hdr-active:#1f3278; --hdr-fg:#ffffff; --hdr-muted:#a9b4dc; --hdr-line:rgba(255,255,255,.2);
  --mint:#1f5136; --mint-fg:#c4f3d5; --amber:#4d3410; --amber-fg:#ffd79a; --rose:#4d1b17; --rose-fg:#ffc9c3;
  --bg:#0c111d; --surface:#161b26; --surface-2:#1f242f; --hover:#1f242f; --line:#333741; --line-strong:#4b505c;
  --fg:#f5f5f6; --fg-2:#cecfd2; --muted:#94969c; --faint:#61646c;
  --accent:#2e90fa; --accent-fg:#ffffff; --accent-soft:#102a56; --accent-hover:#1570ef; --accent-line:#194185; --accent-text:#84caff; --accent-ring:#2e90fa;
  --ok:#17b26a; --ok-soft:#053321; --ok-line:#085d3a; --ok-text:#75e0a7;
  --warn:#f79009; --warn-soft:#4e1d09; --warn-line:#93370d; --warn-text:#fec84b;
  --bad:#f04438; --bad-soft:#55160c; --bad-line:#912018; --bad-text:#fda29b;
  --xs:0 1px 2px rgba(0,0,0,.3); --ring:0 0 0 4px rgba(46,144,250,.24);
  --c-arak:#7b93ff; --c-prajak:#3cc4b7; --c-openmetadata:#a58bff; --c-likit:#f0a43c; --c-bancha:#c9d3ff;
  --code-bg:#070c1f; --code-fg:#dfe6ff; --code-key:#9fb4ff; --code-str:#9be2bb;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1400px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.num,td.num{font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
.mono{font-family:var(--mono);font-size:.88em}

/* ── Shell: navy sidebar (the screenshot's header cards, stacked) beside the cool-grey work area ── */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{background:var(--hdr);color:var(--hdr-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:20px 14px 16px}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.side-body{display:flex;flex-direction:column;flex:1;padding-top:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding-inline:6px}
.logo{width:44px;height:44px;border-radius:11px;background:#3a5cf5;display:grid;place-items:center;flex:none}
.logo .ic{width:25px;height:25px;color:#fff}
.brand b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--hdr-muted);font-size:13.5px;font-weight:500}
.envbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--hdr-line);background:transparent;color:var(--hdr-fg);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:14.5px}
.envbtn span{color:var(--hdr-muted)}
.envbtn b{margin-left:auto;font-weight:500}
.envbtn .ic{width:16px;height:16px;color:var(--hdr-muted)}
.grp-l{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hdr-muted);padding:18px 8px 8px}
.sample.live{color:var(--mint-fg);background:var(--mint)}
.sample{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-fg);background:var(--amber);border-radius:6px;padding:4px 8px}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--hdr-line);background:transparent;color:var(--hdr-fg);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.light{border-color:var(--line);color:var(--fg);background:var(--surface)}
.avatar{width:38px;height:38px;border-radius:50%;background:#3a5cf5;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none}
.nav{display:grid;gap:8px}
.navcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--hdr-card);border:0;border-radius:11px;padding:12px 14px;color:var(--hdr-fg);cursor:pointer;min-width:0;transition:background .15s}
.navcard:hover{background:var(--hdr-card-hover)}
.navcard[aria-current="page"]{background:var(--hdr-active);box-shadow:inset 3px 0 0 #fff}
.navcard b{display:block;font-size:16px;font-weight:600}
.navcard small{display:block;color:var(--hdr-muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navcard > div{min-width:0}
.dot-badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.dot-badge .ic{width:17px;height:17px;stroke-width:2.6}
.dot-badge.ok{background:var(--mint);color:var(--mint-fg)}
.dot-badge.warn{background:var(--amber);color:var(--amber-fg)}
.dot-badge.bad{background:var(--rose);color:var(--rose-fg)}
.dot-badge.icon{background:rgba(255,255,255,.14);color:var(--hdr-fg)}
.dot-badge.icon .ic{stroke-width:2}
.navcard[aria-current="page"] .dot-badge.ok,.navcard[aria-current="page"] .dot-badge.icon{background:#fff;color:var(--hdr)}
.side-foot{margin-top:auto;padding-top:20px}
.me{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;background:var(--hdr-card)}
.me > div{min-width:0;flex:1}
.me b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;font-size:12.5px;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{display:none}
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;color:var(--muted);font-size:14px}
.crumbs .src{color:var(--muted)} .crumbs .src b{color:var(--fg);font-weight:600}
.crumbs .src .ic{width:14px;height:14px}
.crumbs > span:last-child{display:flex;align-items:center;gap:10px}
@media (max-width:900px){
  .shell{display:block}
  .side{position:static;height:auto;padding:12px 16px}
  .brand{padding:0}
  .menubtn{display:grid}
  .side:not(.open) .side-body{display:none}
  .side-body{padding-top:12px}
}

/* ── Sign-in ── */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface)}
.login-main{position:relative;display:flex;align-items:center;justify-content:center;padding:72px clamp(16px,4vw,48px) 48px}
.login-tools{position:absolute;top:16px;right:16px;display:flex;gap:10px;align-items:center}
.login-box{width:min(384px,100%)}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:56px}
.login-logo .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0b1b55 0%,#2a4bd8 62%,#1aa3d9 100%);box-shadow:0 8px 20px -10px rgba(42,75,216,.7)}
.login-logo .logo .ic{width:36px;height:36px}
.login-logo .wm{border-left:2px solid var(--accent);padding-left:12px}
.login-logo b{display:block;font-size:34px;line-height:1;font-weight:700;letter-spacing:.08em;color:var(--fg)}
.login-logo small{display:block;margin-top:5px;font-size:12px;font-weight:500;color:var(--muted)}
.login-box h1{font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.login-box > p{margin:0 0 32px;color:var(--muted);font-size:14px}
.btn-sso{display:flex;width:100%;align-items:center;justify-content:center;gap:12px;border:0;border-radius:7px;padding:9px 16px;min-height:44px;font-weight:600;font-size:15.5px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0b1b55 0%,#2a4bd8 55%,#1aa3d9 100%);box-shadow:0 8px 18px -8px rgba(42,75,216,.65)}
.btn-sso:hover{filter:brightness(1.08)}
.ms{width:26px;height:26px;border-radius:5px;background:#fff;display:grid;place-items:center;flex:none}
.btn-alt{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;margin-top:16px;min-height:44px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--fg);font-size:15.5px;cursor:pointer}
.btn-alt:hover{background:var(--hover)}
.btn-alt .ic{width:18px;height:18px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);padding:0;margin:-12px 0 20px;cursor:pointer;font-size:14px}
.back .ic{width:16px;height:16px;transform:rotate(180deg)}
.login-note{margin-top:28px;color:var(--faint);font-size:12.5px;line-height:1.5}
.login-note .mono{color:var(--muted)}
.login-side{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,5vw,64px)}
.login-side h2{font-size:30px;font-weight:600;margin:0 0 30px;letter-spacing:-.015em;text-wrap:balance}
.feat{display:flex;gap:16px;align-items:flex-start;margin-bottom:26px;max-width:560px}
.feat .fi{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.feat .fi .ic{width:19px;height:19px}
.feat b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
.feat span{color:var(--muted);font-size:14px;text-wrap:pretty}
.btn.block{width:100%;justify-content:center;padding:11px 16px}
.stack{display:grid;gap:14px}
.rcard.acct{display:flex;gap:12px;align-items:center;width:100%}
.rcard.acct b{color:var(--fg)}
.rcard.acct .avatar{color:#fff;font-size:13.5px}
.handoff{min-height:100vh;background:var(--hdr);display:grid;place-items:center;padding:32px 16px}
.ho-card{width:min(660px,100%);background:var(--surface);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.ho-b{padding:20px 24px;display:grid;gap:16px}
.checks li.wait{color:var(--faint)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;padding:20px}
.flow > div{display:flex;gap:12px;align-items:flex-start}
.flow .dot-badge{background:var(--accent-soft);color:var(--accent)}
.flow b{display:block} .flow span{color:var(--muted);font-size:14px}
.app.dim .app-h,.app.dim .dl{opacity:.62}
@media (max-width:900px){.login{grid-template-columns:1fr}.login-side{display:none}.login-logo{margin-bottom:40px}}
.navcard.mini{padding:9px 12px;gap:11px}
.navcard.mini .tile{width:30px;height:30px;font-size:13px;border-radius:8px;background:var(--c);color:#fff}
.navcard.mini b{font-size:15px}
.navcard.mini .go{margin-left:auto;color:var(--hdr-muted)}
.navcard.mini .go .ic{width:15px;height:15px}

/* ── Page head ── */
main{padding-block:0 72px}
.crumbs + .eyebrow{margin-top:18px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:32px;line-height:1.15;font-weight:700;margin:6px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;color:var(--muted);font-size:15px}
.meta b{color:var(--fg);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--surface-2);color:var(--fg);border-radius:9px;padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:filter .15s, background .15s}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:4px;gap:2px;margin-bottom:20px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 16px;border-radius:8px;font-size:16px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .lbl .ic{width:17px;height:17px}
.kpi .val{font-size:34px;font-weight:700;line-height:1.1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:15px}
.kpi.warn .val{color:var(--warn)} .kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)}

/* ── Cards, tables ── */
.card{background:var(--surface);border-radius:13px;border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:600;margin:0}
.card-h p{margin:0;color:var(--muted);font-size:14px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 20px}
.filters .spacer{flex:1}
.filters .count{color:var(--muted);font-size:15px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;background:var(--surface);flex:1 1 260px;max-width:400px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;padding:9px 0;width:100%;color:var(--fg);font-size:15px}
.search:focus-within{border-color:var(--accent)}
.fsel{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:9px;padding:0 10px 0 13px;background:var(--surface);color:var(--muted);font-size:15px}
.fsel select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;color:var(--fg);font-weight:500;padding:9px 18px 9px 2px;cursor:pointer}
.fsel .ic{position:absolute;right:9px;width:15px;height:15px;pointer-events:none}
.fsel:focus-within{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:12px 20px;white-space:nowrap}
td{padding:13px 20px;border-top:1px solid var(--line);vertical-align:top}
tbody tr[data-act]{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.cell-title{font-weight:600}
.cell-sub{color:var(--muted);font-size:14px;margin-top:1px}
.tbl-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ── Chips & pills ── */
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);border-radius:5px;padding:2px 7px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--surface)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.chip.more{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.src{display:inline-flex;align-items:center;gap:7px;color:var(--fg);white-space:nowrap}
.src .ic{color:var(--muted);width:17px;height:17px}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)} .t-mute{color:var(--muted)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c)}

/* ── Overview ── */
.grid-2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.topo{overflow-x:auto;padding:4px 12px 14px}
.topo svg{display:block;min-width:820px;width:100%;height:auto}
.topo .n{fill:var(--surface);stroke:var(--line-strong)}
.topo .n.core{fill:var(--surface-2);stroke:var(--accent)}
.topo .mod{fill:var(--surface);stroke:var(--line)}
.topo .t{fill:var(--fg);font:600 14px var(--font)}
.topo .s{fill:var(--muted);font:400 12px var(--font)}
.topo .h{fill:var(--muted);font:600 11.5px var(--font);letter-spacing:.08em}
.topo .e{fill:none;stroke:var(--line-strong);stroke-width:1.6}
.topo .e.live{stroke:var(--accent);stroke-dasharray:5 5;animation:flow 1.4s linear infinite}
.topo .e.dash{stroke-dasharray:4 5}
.topo .lbl{fill:var(--muted);font:500 11.5px var(--mono)}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){.topo .e.live{animation:none}}
.attn{list-style:none;margin:0;padding:0 8px 8px}
.attn li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px}
.attn li + li{border-top:1px solid var(--line)}
.attn .ic{margin-top:2px}
.attn b{display:block;font-weight:600}
.attn span{color:var(--muted);font-size:14px}
.attn button{margin-left:auto}
.feed{list-style:none;margin:0;padding:0 20px 14px}
.feed li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums}

/* ── Apps ── */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:18px}
.app{display:flex;flex-direction:column}
.app-h{display:flex;gap:14px;align-items:flex-start;padding:18px 20px 14px}
.app-h h3{margin:0;font-size:19px;font-weight:700}
.app-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.app-h .pill{margin-left:auto}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;padding:4px 20px 16px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:3px 0 0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.app-ev{padding:0 20px 16px}
.app-ev .lab{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.app-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);margin-top:auto}
.app-f .grow{flex:1}
.banner{margin:0 20px 14px;padding:10px 12px;border-radius:9px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner b{font-weight:600}
.slot{border:1.5px dashed var(--line-strong);border-radius:13px;display:grid;place-items:center;text-align:center;padding:36px 24px;color:var(--muted);background:transparent;cursor:pointer;min-height:260px}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.slot b{display:block;color:var(--fg);font-size:17px;margin:10px 0 4px}
.contract{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-bottom:18px}
.contract .card{padding:18px 20px}
.contract h3{margin:0 0 4px;font-size:17px}
.contract p{margin:0 0 12px;color:var(--muted);font-size:14px}
.ep{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ep li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.ep code{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.ep .m{font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.ep span.d{grid-column:2;color:var(--muted);font-size:13.5px}
.states{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.states .ic{width:14px;height:14px;color:var(--faint)}
pre.code{background:var(--code-bg);color:var(--code-fg);font:13px/1.6 var(--mono);padding:16px 18px;border-radius:11px;overflow:auto;margin:0;max-height:520px}
pre.code .k{color:var(--code-key)} pre.code .s{color:var(--code-str)}

/* ── Matrix (role bindings / grants) ── */
.mx select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:7px;padding:5px 26px 5px 9px;background:var(--surface) no-repeat right 8px center/12px;cursor:pointer;font-size:14px;min-width:150px}
.mx td.r{position:relative}
.mx .cv{position:absolute;pointer-events:none;width:14px;height:14px;margin:9px 0 0 -26px;color:var(--muted)}
.mx select.none{color:var(--faint)}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px;padding:0 20px 14px}

/* ── Drawer & modal ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.35)}
.d-h{display:flex;gap:14px;align-items:flex-start;padding:20px 24px 16px;padding-top:calc(20px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.d-h h2{margin:0;font-size:21px}
.d-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.d-h .x{margin-left:auto}
.xbtn{width:36px;height:36px;border-radius:8px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.d-b{flex:1;overflow:auto;padding:20px 24px;display:grid;gap:18px;align-content:start}
.d-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.d-f .grow{flex:1}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.box table{min-width:0}
.box th,.box td{padding:9px 10px}
.box th{background:transparent;padding-top:0}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:8px 18px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal .d-h{border-radius:14px 14px 0 0;padding-top:20px}
.modal .d-f{border-radius:0 0 14px 14px;padding-bottom:14px}
.impact{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.impact li{display:flex;gap:10px;align-items:flex-start}
.impact .ic{margin-top:2px;color:var(--muted)}
.field{display:grid;gap:6px}
.field > span{font-size:14px;font-weight:600}
.field small{color:var(--muted);font-size:13px}
.inp{border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;background:var(--surface);width:100%;font-size:15px}
.inp:focus{outline:0;border-color:var(--accent)}
.inp.mono{font-family:var(--mono);font-size:14px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.err{color:var(--bad);font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.check small{display:block;color:var(--muted);font-size:13px}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rcard{border:1.5px solid var(--line);border-radius:11px;padding:14px;background:var(--surface);cursor:pointer;text-align:left}
.rcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rcard b{display:block;margin-bottom:2px}
.rcard span{color:var(--muted);font-size:13.5px}
.secret{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:9px;padding:8px 8px 8px 12px}
.secret code{flex:1;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;padding:14px 24px;background:var(--hdr);overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;color:var(--hdr-muted);font-size:14px;white-space:nowrap;padding:6px 10px 6px 6px;border-radius:9px}
.step .dot-badge{width:26px;height:26px;font-size:12.5px;background:rgba(255,255,255,.12);color:var(--hdr-fg)}
.step.done .dot-badge{background:var(--mint);color:var(--mint-fg)}
.step.cur{background:var(--hdr-active);color:var(--hdr-fg)}
.step.cur .dot-badge{background:#fff;color:var(--hdr)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks small{display:block;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.bar.ok i{background:var(--ok)}
.prog{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:8px 0}
.prog span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px}
.timeline small{color:var(--muted)}

/* ── Toasts ── */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:10px;width:min(400px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:11px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5);display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:tin .2s ease-out}
.toast b{font-family:var(--mono);font-weight:500}
.toast small{display:block;opacity:.75}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}
@media (max-width:640px){
  .head h1{font-size:26px}
  .brand small{display:none}
  .kpi .val{font-size:28px}
  .prog{grid-template-columns:100px minmax(0,1fr) 70px}
}

/* ── Arak look for the work area (OpenMetadata ui-core-components / Untitled UI). The navy sidebar stays as it is. ── */
body{font-size:14px}
.maincol{min-width:0;display:flex;flex-direction:column}
.maincol>main{width:100%;min-width:0;box-sizing:border-box}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:64px;padding:0 clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
.tsearch{display:flex;align-items:center;gap:8px;flex:0 1 480px;min-width:0;height:40px;padding:0 14px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;color:var(--faint)}
.tsearch .ic{order:2;width:18px;height:18px}
.tsearch input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:var(--fg)}
.tsearch input::placeholder{color:var(--muted)}
.tsearch:focus-within{border-color:var(--accent-ring);background:var(--surface);box-shadow:var(--ring)}
.topbar .iconbtn{position:relative;border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:8px}
.topbar .iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.topbar .iconbtn .ic{width:20px;height:20px}
.topbar .iconbtn i{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:600 11px/18px var(--font);font-style:normal}
.tme{display:flex;align-items:center;gap:10px;padding-left:8px;min-width:0}
.tme .avatar{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-size:13px}
.tme b{display:block;font-size:14px;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tme small{display:block;font-size:12px;color:var(--muted)}
main.wrap{padding-top:32px}
.head{align-items:center;margin-bottom:24px}
.head h1{font-size:30px;font-weight:600;line-height:1.25;margin:0 0 8px;letter-spacing:-.02em}
.head .desc{margin:0 0 12px;max-width:720px;color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty}
.meta{gap:4px 20px;font-size:13.5px}
.meta b{font-weight:500}
.btn{border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;background:var(--surface);border-color:var(--line-strong);color:var(--fg-2);box-shadow:var(--xs)}
.btn:hover{background:var(--surface-2);filter:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface)}
.btn.danger{color:var(--bad-text)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.seg{display:flex;width:100%;gap:24px;padding:0;margin-bottom:24px;background:transparent;border-radius:0;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;white-space:nowrap}
.seg button{padding:10px 2px 11px;border-radius:0;font-size:14px;font-weight:600;color:var(--muted)}
.seg button .ic{width:16px;height:16px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--accent-text);box-shadow:inset 0 -2px 0 var(--accent)}
.kpis{gap:20px;margin-bottom:24px}
.kpi{border-radius:12px;padding:20px;box-shadow:var(--xs)}
.kpi .lbl{font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.kpi .lbl .ic{display:none}
.kpi .val{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:12px 0 6px}
.kpi .sub{font-size:12.5px}
.card{border-radius:12px;box-shadow:var(--xs)}
.card-h{align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px}
.card-h p{font-size:13.5px}
.attn li + li{border-top:0}
.attn{padding:8px}
th{background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;padding:12px 20px;border-bottom:1px solid var(--line)}
td{padding:16px 20px}
tbody tr:hover td{background:var(--surface-2)}
.cell-sub{font-size:12.5px}
.search,.fsel{border-radius:8px;border-color:var(--line-strong);box-shadow:var(--xs);min-height:40px}
.search input,.fsel{font-size:14px}
.fsel select{font-weight:400;color:var(--fg)}
.inp{border-radius:8px;border-color:var(--line-strong);box-shadow:var(--xs);font-size:14px}
.search:focus-within,.fsel:focus-within,.inp:focus{border-color:var(--accent-ring);box-shadow:var(--ring)}
.pill{font-size:12px;font-weight:500;padding:2px 9px 2px 8px;border:1px solid var(--line)}
.pill::before{width:6px;height:6px}
.pill.ok{border-color:var(--ok-line);color:var(--ok-text)}
.pill.warn{border-color:var(--warn-line);color:var(--warn-text)}
.pill.bad{border-color:var(--bad-line);color:var(--bad-text)}
.pill.info{border-color:var(--accent-line);color:var(--accent-text)}
.pill.mute{color:var(--fg-2)}
.tag{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;background:var(--surface);border:1px solid var(--line-strong);color:var(--fg-2);border-radius:6px;padding:1px 7px}
.chip{border-radius:16px;padding:2px 9px}
.sample{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;border-radius:16px;padding:3px 10px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn-text);white-space:nowrap}
.sample.live{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-text)}
.banner{border-radius:12px;border:1px solid transparent}
.banner.warn{border-color:var(--warn-line);color:var(--warn-text)}
.banner.bad{border-color:var(--bad-line);color:var(--bad-text)}
.banner.info{border-color:var(--accent-line);color:var(--accent-text)}
.t-ok{color:var(--ok-text)} .t-warn{color:var(--warn-text)} .t-bad{color:var(--bad-text)}
.sec h3,.dl dt,.app-ev .lab{letter-spacing:0;text-transform:none}
.sec h3{font-size:14px;color:var(--fg)}
.dl dt,.app-ev .lab{font-size:12.5px;font-weight:500}
.app-h h3{font-size:18px;font-weight:600}
.drawer{background:var(--surface-2)}
.box,.rcard,.slot{border-radius:12px}
.modal{border-radius:12px}
.login-side{background:#fafafa}
:root[data-theme="dark"] .login-side{background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login-side{background:var(--surface-2)}}
/* Overview hero, like Arak's Home */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:36px 32px 32px;margin-bottom:24px;color:#fff;background:linear-gradient(120deg,#1849a9 0%,#1570ef 55%,#2e90fa 100%)}
.hero-in{position:relative;max-width:720px}
.hero-k{font-size:14px;font-weight:600;opacity:.92}
.hero h1{font-size:30px;font-weight:600;line-height:1.25;letter-spacing:-.02em;margin:6px 0 10px}
.hero p{margin:0;font-size:16px;line-height:1.5;opacity:.92;text-wrap:pretty}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
.hero-meta span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.hero-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero .btn.white{background:#fff;border-color:#fff;color:#182230}
.hero .btn.white:hover{background:#f2f4f7}
.hero .btn.onhero{background:transparent;border-color:transparent;box-shadow:none;color:#fff;padding-inline:10px}
.hero .btn.onhero:hover{background:rgba(255,255,255,.14)}
.hero-art{position:absolute;right:-24px;bottom:-70px;width:320px;height:320px;opacity:.16;pointer-events:none}
.hero-art .ic{width:100%;height:100%;stroke-width:1.1;color:#fff}
/* Sidebar, Arak-style rows on the navy background */
.shell{grid-template-columns:272px minmax(0,1fr)}
.side{padding:18px 12px 14px}
.brand .logo{width:40px;height:40px;border-radius:10px}
.brand b{font-size:18px;font-weight:600}
.brand small{font-size:12.5px}
.envbtn{padding:8px 12px;font-size:14px;border-radius:8px;background:rgba(255,255,255,.04)}
.grp-l{font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:22px 14px 8px}
.nav{gap:2px}
.navcard{gap:12px;height:44px;padding:0 14px;border-radius:8px;background:transparent;color:var(--hdr-muted);font-size:15px;font-weight:500;transition:background .15s,color .15s}
.navcard > .ic{width:20px;height:20px;flex:none;stroke-width:1.75}
.navcard .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navcard:hover{background:rgba(255,255,255,.07);color:#fff}
.navcard[aria-current="page"]{background:#1570ef;color:#fff;box-shadow:none}
.navcard:focus-visible{outline:2px solid #84caff;outline-offset:1px}
.nb{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:#f04438}
.nb.warn{background:#f79009}
.navcard[aria-current="page"] .nb{background:#fff;color:#1570ef}
.navcard.mini{height:40px;padding:0 12px;gap:12px}
.navcard.mini .tile{width:22px;height:22px;font-size:11px;border-radius:6px}
.navcard.mini .go{margin-left:0;opacity:0;transition:opacity .15s}
.navcard.mini:hover .go,.navcard.mini:focus-visible .go{opacity:1}
.side-foot{border-top:1px solid var(--hdr-line);margin-top:auto;padding:14px 4px 0}
.side-foot .me{background:transparent;padding:0}
@media (hover:none){.navcard.mini .go{opacity:1}}
.tile[data-logo]{background:transparent !important;padding:0}
.tile[data-logo] img{width:100%;height:100%;object-fit:contain;display:block}
/* Logos sit on a white chip where the background is dark (navy sidebar, dark mode) */
.navcard.mini .tile[data-logo]{background:#fff !important;padding:2px;width:24px;height:24px}
:root[data-theme="dark"] .tile[data-logo]{background:#fff !important;padding:5px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile[data-logo]{background:#fff !important;padding:5px}}
/* Notifications panel */
.bellwrap{position:relative;display:flex}
.bellpanel{position:absolute;right:-8px;top:calc(100% + 10px);width:min(384px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);z-index:60;overflow:hidden;animation:page-enter 180ms cubic-bezier(.16,1,.3,1) both}
.bp-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.bp-h b{font-size:15px;font-weight:600}
.bp-h small{color:var(--muted);font-size:13px}
.bp-list{max-height:min(420px,60vh);overflow-y:auto}
.bp-item{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px;cursor:pointer;color:var(--fg);font:inherit}
.bp-item:hover{background:var(--surface-2)}
.bp-item:focus-visible{outline:2px solid var(--accent-ring);outline-offset:-2px}
.bp-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.bp-ic .ic{width:16px;height:16px}
.bp-ic.t-bad{background:var(--bad-soft)} .bp-ic.t-warn{background:var(--warn-soft)}
.bp-tx{flex:1;min-width:0}
.bp-tx b{display:block;font-size:14px;font-weight:600}
.bp-tx small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.bp-new{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.bp-empty{display:flex;align-items:center;gap:8px;padding:20px 16px;color:var(--muted)}
.bp-empty .ic{width:16px;height:16px;color:var(--ok)}
.bp-f{display:block;width:100%;border:0;background:transparent;padding:12px 16px;color:var(--accent-text);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.bp-f:hover{background:var(--surface-2)}
@media (max-width:640px){.bellwrap{position:static}.bellpanel{left:16px;right:16px;top:calc(100% + 8px);width:auto}}
@keyframes page-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-enter{animation:page-enter 320ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.page-enter{animation:none}}
@media (max-width:760px){.hero-art{display:none}.hero{padding:26px 20px}.hero h1{font-size:24px}}
@media (max-width:640px){.tme > div,.topbar .sample{display:none}.tsearch{flex:1}.head h1{font-size:24px}}

function pageHead({ eyebrow, title, meta, actions, seg }){

}
function seg(page, items){
  return `<div class="seg" role="group" aria-label="View">${items.map(([id, label, icon]) =>

}
const kpis = list => `<div class="kpis">${list.map(k => `<div class="kpi ${k.tone || ''}"><div class="lbl">${ic(k.icon)}${esc(k.label)}</div><div class="val">${k.value}</div><div class="sub">${k.sub}</div></div>`).join('')}</div>`;
const search = (id, key, ph) => `<label class="search" for="${id}">${ic('search')}<input id="${id}" data-q="${key}" value="${esc(state.q[key])}" placeholder="${esc(ph)}" autocomplete="off"></label>`;
const fsel = (id, label, key, opts) => `<label class="fsel" for="${id}"><span>${esc(label)}</span><select id="${id}" data-f="${key}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${state.f[key] === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${ic('chev')}</label>`;
const match = (q, ...fields) => !q || fields.join(' ').toLowerCase().includes(q.toLowerCase());

/* ───────────── Nav ───────────── */
function navHTML(){
  const failing = CONNS.filter(isFailing).length;
  const due = CONNS.filter(c => c.test.ok && secretAge(c) > 90).length;
  const dead = DLV.filter(d => d.status === 'dead').length, retrying = DLV.filter(d => d.status === 'retrying').length;
  const la = liveApps(), active = la.filter(a => a.status === 'active').length, other = la.length - active;
  const items = [
    ['overview','Overview','home', `Feed seq ${fmt(SEQ)}`, null],
    ['identity','Users & groups','users', '1,284 users · 46 groups', null],
    ['connections','Connections','plug', `${CONNS.length} connections · ${failing} failing`, failing ? ['bad', failing, `${failing} connection${failing === 1 ? '' : 's'} failing the test`] : due ? ['warn', due, `${due} secret${due === 1 ? '' : 's'} older than 90 days, rotate soon`] : null],
    ['apps','App registry','server', `${active} active${other ? ' · ' + other + ' in transition' : ''} · contract v1`, other ? ['warn', other, `${other} app${other === 1 ? '' : 's'} not active yet`] : null],
    ['sync','Distribution','send', `${dead} dead letter · ${retrying} retrying`, dead ? ['bad', dead, `${dead} deliver${dead === 1 ? 'y' : 'ies'} in dead letter. Open Distribution and press Retry to clear`] : retrying ? ['warn', retrying, `${retrying} deliver${retrying === 1 ? 'y' : 'ies'} retrying`] : null],
  ];
  const u = me(), admin = isAdmin(u), acc = userAccess(u), nAcc = Object.keys(acc).length;
  const card = ([id, title, icn, sub, badge]) => `<button class="navcard" id="nav-${id}" data-act="nav" data-page="${id}" title="${esc(badge ? badge[2] : sub)}" ${state.page === id ? 'aria-current="page"' : ''}>
    ${ic(icn)}<span class="nl">${title}</span>${badge ? `<span class="nb ${badge[0]}" aria-label="${esc(badge[2])}">${badge[1]}</span>` : ''}</button>`;
  const open = liveApps().filter(a => acc[a.key] && ['active','degraded'].includes(a.status));
  return `<aside class="side ${state.menuOpen ? 'open' : ''}">
    <div class="side-top"><div class="brand"><div class="logo">${ic('hub')}</div><div><b>Bancha</b><small>Control plane</small></div></div>
      <button class="iconbtn menubtn" data-act="menu" aria-label="Menu" aria-expanded="${state.menuOpen}">${ic(state.menuOpen ? 'x' : 'menu')}</button></div>
    <div class="side-body">
      <button class="envbtn" data-act="env"><span>Environment</span><b>Production</b>${ic('chev')}</button>
      ${admin ? `<div class="grp-l">Control plane</div><nav class="nav" aria-label="Control plane">${items.map(card).join('')}</nav>` : ''}
      <div class="grp-l">Go to app</div><nav class="nav" aria-label="Go to app">
        ${card(['myapps','My apps','grid', `${nAcc} app${nAcc === 1 ? '' : 's'} you can open`, null])}
        ${open.map(a => `<button class="navcard mini" data-act="launch" data-id="${a.key}" title="Open ${esc(a.name)} as ${esc(roleName(a.key, acc[a.key].role))}, already signed in">${tile(a)}<span class="nl">${esc(a.name)}</span><span class="go">${ic('external')}</span></button>`).join('')}</nav>
      <div class="side-foot"><div class="me"><span class="avatar">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${esc(METHOD[state.session.method])}${admin ? ' · admin' : ''}</small></div>
        <button class="iconbtn" data-act="signout" aria-label="Sign out of all apps" title="Sign out of all apps">${ic('logout')}</button></div></div>
    </div></aside>`;
}
const CRUMB = { myapps:['Go to app','My apps'], overview:['Control plane','Overview'], identity:['Control plane','Users & groups'], connections:['Control plane','Connections'], apps:['Control plane','App registry'], sync:['Control plane','Distribution'] };
const themeBtn = (cls = 'light') => `<button class="iconbtn ${cls}" data-act="theme" aria-label="Toggle dark mode">${ic(isDark() ? 'sun' : 'moon')}</button>`;
function bellPanel(att){
  const item = x => `<button class="bp-item" data-act="${x.act}" data-id="${esc(x.id)}"><span class="bp-ic t-${x.tone}">${ic(x.icon)}</span><span class="bp-tx"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span>${state.bellNew.has(x.title) ? '<span class="bp-new" aria-label="New"></span>' : ''}</button>`;
  return `<div class="bellpanel" role="dialog" aria-label="Notifications">
    <div class="bp-h"><b>Notifications</b><small>${att.length ? `${att.length} item${att.length === 1 ? '' : 's'}` : ''}</small></div>

}
function topbar(){
  const u = me(), admin = isAdmin(u), att = admin ? attention() : [], n = att.filter(a => a.tone !== 'mute' && !state.readAtt.has(a.title)).length;

const MS_LOGO = '<svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect width="10" height="10" fill="#f25022"/><rect x="11" width="10" height="10" fill="#7fba00"/><rect y="11" width="10" height="10" fill="#00a4ef"/><rect x="11" y="11" width="10" height="10" fill="#ffb900"/></svg>';
function loginHTML(){
  const L = state.login, target = L.target && app(L.target);

  const choose = `<button class="btn-sso" data-act="sso"><span class="ms">${MS_LOGO}</span>Sign in with MFEC</button>
      <button class="btn-alt" data-act="lgmode" data-id="form">${ic('user')}Sign in with username</button>`;
  const form = `<button class="back" data-act="lgmode" data-id="choose">${ic('arrow')}Other ways to sign in</button>
      <form id="loginform" class="stack" novalidate>
        <label class="field"><span>Username</span><input class="inp" id="lg-user" data-lg="user" value="${esc(L.user)}" autocomplete="username" placeholder="siriporn.k"></label>

        ${L.err ? `<div class="err" role="alert">${esc(L.err)}</div>` : ''}
        <button class="btn primary block" type="submit">Sign in</button>
      </form>`;
  const feat = (icon, t, d) => `<div class="feat"><span class="fi">${ic(icon)}</span><div><b>${t}</b><span>${d}</span></div></div>`;
  return `<div class="login">
    <section class="login-main">
      <div class="login-tools"><span class="sample">Prototype</span>${themeBtn()}</div>

        <h1>Sign in</h1>
        <p>${sub}</p>
        ${L.mode === 'form' ? form : choose}

        <div class="login-note">Prototype: any password works. Try <span class="mono">siriporn.k</span> (no admin) or <span class="mono">sakan.pu</span> (admin). MFEC sign-in shows a sample account list.</div>

    </section>
    <section class="login-side" aria-label="About Bancha">

${k('metadata')}:

${k('spec')}:

${a.roles.map(([rk, rn]) => `    - ${k('key')}: ${rk}\n      ${k('name')}: ${esc(rn)}`).join('\n')}
  ${k('requires')}:
    ${k('identity')}:
      ${k('users')}: { ${k('attributes')}: [${a.attrs.join(', ')}] }

${a.key === 'arak' ? `      - { ${k('types')}: [postgresql, oracle, snowflake], ${k('profiles')}: [admin] }\n      - { ${k('types')}: [openmetadata], ${k('profiles')}: [read] }` : a.key === 'openmetadata' ? `      - { ${k('types')}: [postgresql, oracle, mssql, snowflake, databricks], ${k('profiles')}: [metadata] }` : `      - { ${k('types')}: [postgresql, oracle, mssql, snowflake, databricks, trino], ${k('profiles')}: [read] }\n      - { ${k('types')}: [openmetadata], ${k('profiles')}: [write] }`}
  ${k('events')}:
    ${k('subscribe')}: [${a.subs.join(', ')}]${a.pub.length ? `\n    ${k('publish')}: [${a.pub.join(', ')}]` : ''}
  ${k('delivery')}: { ${k('mode')}: ${a.mode}${a.mode === 'adapter' ? ', ' + k('adapter') + ': openmetadata' : ''} }${a.deps.length ? `\n  ${k('dependsOn')}: [${a.deps.join(', ')}]` : ''}`;

function eventFor(e, appKey){
  const a = app(appKey);
  const isUser = e.subject.startsWith('users/');
  const u = isUser && USERS.find(x => 'users/' + x.user === e.subject);
  let data;
  if (u) { data = { id:'u_' + u.user.replace('.', '_'), version:u.ver };
    (a ? a.attrs : ['username','email','displayName']).forEach(f => data[f] = f === 'username' ? u.user : f === 'email' ? u.email : f === 'displayName' ? u.name : f === 'department' ? u.dept : f === 'manager' ? 'u_sakan_pu' : null);
    data.status = u.status; data.groups = u.groups; data.roles = a ? [userAccess(u)[a.key]?.role].filter(Boolean) : []; }
  else if (e.subject.startsWith('connections/')) { const c = CONNS.find(x => 'connections/' + x.id === e.subject);
    data = c ? { id:c.id, version:7, type:c.type.toLowerCase().replace(' ', ''), host:c.host, port:c.port, database:c.db, profiles:(c.grants[appKey] || []), credentialsUrl:`/api/v1/app/connections/${c.id}/credentials` } : {}; }
  else data = { subject:e.subject, version:1 };
  return { specversion:'1.0', id:'evt_01JA3K' + String(e.seq).slice(-4) + 'Q2X', source:'bancha://prod', type:'io.bancha.' + e.type, subject:e.subject, time:'2026-10-13T15:10:22Z', datacontenttype:'application/json', banchaseq:e.seq, data };
}
const jsonHL = o => esc(JSON.stringify(o, null, 2)).replace(/(&quot;[^&]*?&quot;)(:)/g, '<span class="k">$1</span>$2').replace(/: (&quot;.*?&quot;)/g, ': <span class="s">$1</span>');

function pSync(){
  const sub = state.sub.sync;

    actions: btn('refresh','Retry failed','retryall') ,
    seg: seg('sync', [['deliveries','Deliveries','activity'],['feed','Change feed','zap'],['audit','Audit log','shield']]) });
  const dead = DLV.filter(d => d.status === 'dead').length, retrying = DLV.filter(d => d.status === 'retrying').length;
  const k = kpis([
    { icon:'zap', label:'Events · 24 h', value:'3,412', sub:'written to the change feed' },
    { icon:'check', label:'Delivered', value:'99.6%', sub:'first attempt 97.1%', tone:'ok' },

  return head + k + `<section class="card"><div class="filters">${search('q-dlv','dlv','Search event, subject, seq')}
    ${fsel('f-dapp','App','dApp',[['all','All'], ...la.map(a => [a.key, a.name])])}

    <div class="tbl-wrap"><table><thead><tr><th>Seq</th><th>Event</th><th>App</th><th>Status</th><th>Attempts</th><th>Latency</th><th>Time</th><th></th></tr></thead><tbody>
    ${rows.map(d => `<tr data-act="dlv" data-id="${esc(d.id)}" tabindex="0"><td class="num mono">${fmt(d.seq)}</td>
      <td><div class="mono">${esc(d.type)}</div><div class="cell-sub">${esc(d.subject)}</div></td>
      <td>${appChip(d.app, app(d.app)?.name || d.app)}</td>

function audit(action, target, detail){ AUDIT.unshift({ time:clock().slice(0, 5), actor:me()?.user || 'system', action, target, detail }); }
function emit(type, subject, targets){
  targets = targets || liveApps().filter(a => ['active','provisioning'].includes(a.status)).map(a => a.key);
  SEQ++; const seq = SEQ, t = clock();
  FEED.unshift({ seq, type, subject, v:1, actor:me()?.user || 'system', time:t, n:targets.length });
  targets.forEach(k => DLV.unshift({ id:'dlv_' + rnd(8), seq, type, subject, app:k, status:'pending', attempts:0, ms:null, time:t }));
  toast(`<b>${esc(type)}</b> · seq ${fmt(seq)}`, targets.length ? `Queued for ${targets.map(k => app(k)?.name || k).join(', ')}` : 'Recorded in the change feed. No app is subscribed.');
  setTimeout(() => {
    DLV.filter(d => d.seq === seq && d.status === 'pending').forEach(d => { const a = app(d.app); if (a && a.status === 'suspended') return; d.status = 'delivered'; d.attempts = 1; d.ms = 70 + Math.floor(Math.random() * 300); });

  goapps: () => go('apps', 'registry'),
  gosync: d => go('sync', d.id || 'deliveries'),
  gousers: () => { state.f.uApp = 'none'; go('identity', 'users'); },
  addconn: () => openLayer('addconn'),
  register: () => { if (app('likit') && app('likit').status !== 'removed') { toast('Likit is already registered', 'Unregister it first to run the example again'); return; } state.wiz = newWizard(); openLayer('wizard'); },
  regtoken: () => { state.wiz = newWizard(); state.wiz.method = 'token'; state.wiz.token = 'rt_' + rnd(28); openLayer('wizard'); },
  adduser: () => toast('Local users are for service and break-glass accounts', 'People should come from Azure AD or LDAP'),
  syncdirs: () => { audit('directory.sync','all directories','Manual sync'); emit('user.updated', 'users/napat.r'); },
  syncdir: (d, el, e) => { e.stopPropagation(); audit('directory.sync', d.id, 'Manual sync'); toast(`Sync started for ${esc(d.id)}`, 'Changed users and groups will appear in the change feed'); },
  testall: async () => { if (!LIVE.on) return toast('Testing 11 connections from Bancha', 'crm-sqlserver and hr-mysql are expected to fail again');
    toast(`Testing ${CONNS.length} connections`, 'Read-only checks against the real systems');
    const out = await Promise.all(CONNS.map(c => liveTest(c.id).catch(() => null)));
    LIVE.at = new Date().toTimeString().slice(0, 5); render(); renderLayer();
    toast(`${out.filter(c => c && c.test.ok).length} of ${CONNS.length} connected`, out.filter(c => c && !c.test.ok).map(c => c.id).join(', ') || 'All passed'); },
  test: async d => { if (LIVE.on) { toast(`Testing ${esc(d.id)}…`, 'Read-only check from Bancha');
      try { const c = await liveTest(d.id); render(); renderLayer(); toast(c.test.ok ? `${esc(c.id)}: connected in ${c.test.ms} ms` : `${esc(c.id)}: ${esc(c.test.err)}`, c.test.ok ? 'Real check from Bancha' : 'See what is missing in the drawer'); }
      catch (e) { toast('Test failed to run', esc(e.message)); } return; }
    const c = CONNS.find(x => x.id === d.id); toast(c.test.ok ? `${esc(c.id)}: connected in ${c.test.ms} ms` : `${esc(c.id)}: ${esc(c.test.err)}`, c.test.ok ? 'Tested from Bancha' : 'Check the firewall rule or the account, then test again'); },
  testapps: d => { emit('connection.test.requested', 'connections/' + d.id, Object.keys(CONNS.find(x => x.id === d.id).grants).filter(k => app(k)?.status === 'active')); },
  rotate: d => { const c = CONNS.find(x => x.id === d.id); c.profiles.find(p => p.p === d.p).rot = 0; audit('connection.rotate', c.id, `Profile ${d.p} rotated`);
    emit('connection.secret.rotated', 'connections/' + c.id, Object.entries(c.grants).filter(([k, v]) => v.includes(d.p) && app(k)).map(([k]) => k)); },
  resenduser: d => emit('user.updated', 'users/' + d.id),
  resync: d => { audit('app.resync', d.id, 'Full resync requested'); emit('sync.resync.requested', 'apps/' + d.id, [d.id]); },
  suspend: d => { const a = app(d.id); a.status = 'suspended'; a.hb = 'suspended'; audit('app.suspend', a.key, ''); emit('app.suspended', 'apps/' + a.key, [a.key]); },
  resume: d => { const a = app(d.id); a.status = 'active'; audit('app.resume', a.key, `Catching up from seq ${a.applied}`); emit('app.activated', 'apps/' + a.key, [a.key]); },
  unregister: d => openLayer('unregister', d.id),
  'unregister-go': d => { const a = app(d.id); const g = Number($('#un-grace').value); closeLayer();
    a.status = 'deregistering'; a.grace = g ? `grace period ends in ${g} h` : 'removing now';
    audit('app.unregister', a.key, `Grace ${g} h`); emit('app.deregistering', 'apps/' + a.key, [a.key]);
    if (!g) removeApp(a.key); },
  purged: d => removeApp(d.id, 'App confirmed purge'),
  forceremove: d => removeApp(d.id, 'Forced by admin'),
  retry: (d, el, e) => { e.stopPropagation(); const x = DLV.find(y => y.id === d.id); x.status = 'delivered'; x.attempts++; x.ms = 160; x.err = null;
    const a = app(x.app); if (a && a.status === 'active') { DLV.filter(y => y.app === a.key && y.status === 'retrying').forEach(y => { y.status = 'delivered'; y.attempts++; y.ms = 150; y.err = null; }); a.applied = SEQ; a.hb = 'just now'; }
    toast(`Delivered ${esc(x.type)} to ${esc(a?.name || x.app)}`, '200 OK · the app is caught up with the feed'); rerender(); },
  retryall: () => { DLV.filter(d => ['dead','retrying'].includes(d.status)).forEach(d => { d.status = 'delivered'; d.attempts++; d.ms = 150; d.err = null; });
    liveApps().filter(a => a.status === 'active').forEach(a => { a.applied = SEQ; a.hb = 'just now'; }); toast('All failed deliveries were sent again', 'Every active app is now in sync'); rerender(); },
  copy: d => { const done = () => toast('Copied to clipboard'); try { navigator.clipboard.writeText(d.v).then(done, () => toast('Copy failed', 'Select the text and copy it manually')); } catch { toast('Copy failed', 'Select the text and copy it manually'); } },
  toast: d => toast(esc(d.msg)),
  wzmethod: d => { state.wiz.method = d.id; renderLayer(); },
  wztoken: () => { state.wiz.token = 'rt_' + rnd(28); renderLayer(); },
  wzback: () => { state.wiz.step--; renderLayer(); },
  wznext: () => { const w = state.wiz;
    if (w.step === 4) { finishWizard(); return; }
    w.step++; renderLayer();
    if (w.step === 4) { wzTimer = setInterval(() => { w.pct = Math.min(100, w.pct + 7); if (w.pct >= 100) { w.done = true; clearInterval(wzTimer); wzTimer = null; } if (state.layer?.kind === 'wizard') renderLayer(); }, 140); } },
};
function removeApp(key, why){
  const i = APPS.findIndex(a => a.key === key); if (i < 0) return;
  const [a] = APPS.splice(i, 1); a.status = 'removed'; REMOVED.push(a);
  GROUPS.forEach(g => delete g.bind[key]); CONNS.forEach(c => delete c.grants[key]);
  audit('app.removed', key, `${why || 'Grace period 0 h'} · credentials revoked · bindings archived`);
  toast(`${esc(a.name)} removed`, 'Credentials revoked. Bindings and grants are archived in the audit log.'); rerender();
}
function finishWizard(){
  const w = state.wiz;
  const a = { key:'likit', name:'Likit', purpose:'Example registration · replace with Likit’s manifest', kind:'App', version:'0.9.0', baseUrl:'https://likit.internal', mode:'webhook', status:'active', hb:'just now', applied:SEQ, users:wzUsers(), owner:'likit-team@example.co.th',
    roles:[['admin','Likit Admin'],['author','Author'],['reader','Reader']], deps:['openmetadata'], subs:['user.*','group.*','rolebinding.*','connection.*','app.*'], pub:[],
    attrs:Object.keys(w.attrs).filter(k => w.attrs[k]), provides:[], consumes:[] };
  const old = REMOVED.findIndex(x => x.key === 'likit'); if (old >= 0) REMOVED.splice(old, 1);
  APPS.push(a);
  Object.entries(w.roleMap).forEach(([rk, gn]) => { const g = GROUPS.find(x => x.name === gn); if (g) g.bind.likit = rk; });
  Object.entries(w.conns).filter(([, v]) => v).forEach(([k]) => { const [c, p] = k.split('|'); const cc = CONNS.find(x => x.id === c); if (cc) (cc.grants.likit = cc.grants.likit || []).push(p); });
  audit('app.register', 'likit', `Approved ${a.attrs.length} attributes, ${Object.values(w.conns).filter(Boolean).length} connection grants`);
  closeLayer(); go('apps', 'registry'); emit('app.activated', 'apps/likit', ['likit']);
}

/* ───────────── Wiring ───────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (state.bellOpen && !(t && t.dataset.act === 'bell') && !(!t && e.target.closest('.bellpanel'))) { state.bellOpen = false; render(); }
  if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'TR' && e.target.closest('button,select,input,a')) return;
  fn(t.dataset, t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.bellOpen) { state.bellOpen = false; render(); $('[data-act=bell]')?.focus(); return; }
  if (e.key === 'Escape' && state.layer) closeLayer();
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click();
  if (e.key === 'Enter' && e.target.id === 'gsearch') { state.q.users = e.target.value.trim(); state.sub.identity = 'users'; go('identity'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q !== undefined) { state.q[t.dataset.q] = t.value; render(); }
  if (t.id === 'wz-url') state.wiz.url = t.value;
  if (t.dataset.lg) state.login.user = t.value;
  if (t.dataset.un) { const a = state.layer && app(state.layer.id); const ov = $('#un-override'); $('#un-go').disabled = !($('#un-key').value.trim() === a.key && (!ov || ov.checked)); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { state.f[t.dataset.f] = t.value; render(); }
  if (t.dataset.bind) { const [gi, ak] = t.dataset.bind.split('|'); const g = GROUPS[gi]; const before = g.bind[ak];
    if (t.value) g.bind[ak] = t.value; else delete g.bind[ak];
    audit(t.value ? 'rolebinding.grant' : 'rolebinding.revoke', `${ak}/${t.value || before}`, `Group ${g.name}`);
    emit(t.value ? 'rolebinding.granted' : 'rolebinding.revoked', `${ak}/${t.value || before} ← ${g.name}`, [ak]); }
  if (t.dataset.grant) { const [cid, ak, p] = t.dataset.grant.split('|'); const c = CONNS.find(x => x.id === cid); const list = c.grants[ak] = c.grants[ak] || [];
    if (t.checked) list.push(p); else list.splice(list.indexOf(p), 1);
    audit(t.checked ? 'connection.grant' : 'connection.revoke', cid, `Profile ${p} ${t.checked ? 'granted to' : 'revoked from'} ${app(ak).name}`);
    emit(t.checked ? 'connection.granted' : 'connection.revoked', 'connections/' + cid, [ak]); }
  if (t.dataset.wz) { const w = state.wiz; const [kind, key] = t.dataset.wz.split('|');
    if (kind === 'attr') w.attrs[key] = t.checked;
    if (kind === 'gmode') w.groupsMode = key;
    if (kind === 'grp') { if (t.checked) w.groups.push(key); else w.groups = w.groups.filter(x => x !== key); }
    if (kind === 'conn') w.conns[key] = t.checked;
    if (kind === 'role') w.roleMap[key] = t.value;
    renderLayer(); }
  if (t.dataset.un) t.dispatchEvent(new Event('input', { bubbles:true }));
});
document.addEventListener('submit', e => {
  if (e.target.id === 'loginform') { e.preventDefault();
    const L = state.login, id = $('#lg-user').value.trim().toLowerCase(), pw = $('#lg-pass').value; L.user = id;
    const fail = m => { L.err = m; render(); };
    if (!id || !pw) return fail('Enter your username and password.');
    const u = USERS.find(x => x.user === id || x.email === id);
    if (!u) return fail('Username or password is incorrect.');
    if (u.src === 'Azure AD') return fail(`${u.email} is an Azure AD account. Use "Sign in with MFEC" so MFA applies.`);
    if (u.user.startsWith('svc')) return fail('Service accounts cannot sign in interactively. They use client credentials.');
    return signIn(u, u.src === 'LDAP' ? 'ldap' : 'local'); }
  if (e.target.id !== 'connform') return; e.preventDefault();
  const v = id => $('#' + id).value.trim();
  const name = v('cf-name'), host = v('cf-host');
  if (!name || !host || !v('cf-user')) { state.layer.err = 'Name, host and account are required.'; renderLayer(); state.layer.err = ''; return; }
  if (!/^[a-z][a-z0-9-]+$/.test(name)) { state.layer.err = 'Use lowercase letters, digits and dashes for the name, e.g. finance-dw.'; renderLayer(); state.layer.err = ''; return; }
  if (CONNS.some(c => c.id === name)) { state.layer.err = `A connection named ${name} already exists.`; renderLayer(); state.layer.err = ''; return; }
  const prof = v('cf-prof'); const targets = [...document.querySelectorAll('#connform input[type=checkbox]:checked')].map(x => x.value);
  const c = { id:name, cat:$('#cf-cat').value, type:$('#cf-type').value, host, port:Number(v('cf-port')) || 0, db:v('cf-db') || '—', owner:'DG-Platform-Admins',
    profiles:[P(prof, v('cf-user'), 0)], grants:Object.fromEntries(targets.map(k => [k, [prof]])), test:{ ok:true, ms:44, at:clock().slice(0, 5) } };
  CONNS.push(c); audit('connection.create', name, `${c.type} ${host}`);
  closeLayer(); state.sub.connections = c.cat; go('connections');
  if (targets.length) emit('connection.granted', 'connections/' + name, targets);
  else toast(`${esc(name)} saved and tested in 44 ms`, 'No app can use it yet. Open it to grant a profile.');
});

try { const t = localStorage.getItem('bancha-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch {}
render();

/* ───────────── Live connections (when served by server/server.js) ───────────── */
function fromApi(x){
  const t = x.test || { ok:false, ms:null, at:'—', err:'Not tested yet' };
  const i = x.info || {};
  return { id:x.id, cat:x.cat, type:x.type, host:x.host, port:x.port || '', db:x.db, owner:x.owner, note:x.note, live:true, missing:x.missing || [], info:x.info,
    profiles:x.profiles.map(p => P(p.p, p.u, 0)), grants:x.grants || {}, test:{ ok:t.ok, ms:t.ms, at:t.at, err:t.err },
    dir: x.cat === 'directory' ? { filter:'—', every:'Not scheduled yet', last: t.ok ? 'Reachable · ' + t.at : '—', users:i.users || 0, groups:i.groups || 0, changed:0 } : null };
}
function applyLive(list){ CONNS.splice(0, CONNS.length, ...list.map(fromApi)); LIVE.on = true; LIVE.at = new Date().toTimeString().slice(0, 5); }
async function loadLive(){
  if (location.protocol === 'file:') return;
  try { const r = await fetch('api/connections', { cache:'no-store' }); if (!r.ok) return;
    const d = await r.json(); if (!d.live) return; applyLive(d.connections); render(); renderLayer(); loadIdentity(); } catch {}
}
async function loadIdentity(again){
  try { const r = await fetch('api/identity' + (again ? '?refresh' : ''), { cache:'no-store' }); if (!r.ok) return;
    Object.assign(IDN, await r.json(), { on:true }); render(); } catch {}
}
async function liveTest(id){
  const r = await fetch(`api/connections/${encodeURIComponent(id)}/test`, { method:'POST' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const c = fromApi(await r.json()); const i = CONNS.findIndex(x => x.id === id); if (i >= 0) CONNS[i] = c; return c;
}
loadLive();
</script>
