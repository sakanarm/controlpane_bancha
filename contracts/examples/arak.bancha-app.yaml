apiVersion: bancha.io/v1
kind: App
metadata:
  key: arak
  name: Arak
  description: Data Access Control. Requests, approves and applies GRANT/REVOKE on data sources.
  owner: data-governance@example.co.th
  icon: shield
spec:
  version: 2.3.0
  baseUrl: https://arak.internal
  endpoints:
    health: /bancha/health
    events: /bancha/events
  auth:
    oidc:
      redirectUris: [https://arak.internal/auth/callback]
      postLogoutRedirectUris: [https://arak.internal/]
  # Roles as Arak stores them today in app_role_assignment.app_role (read from arakdb, 14 Oct 2026).
  roles:
    - key: platform-admin
      name: Platform Admin
      description: Manages policies, approval workflows and Arak settings
      appValue: PLATFORM_ADMIN
    - key: data-owner
      name: Data Owner
      description: Approves access requests for the data it owns
      appValue: DATA_OWNER
      scoped: true          # bound to an OpenMetadata FQN, stored in app_role_assignment.scope_fqn
    - key: requester
      name: Access Requester
      appValue: REQUESTER
      default: true
    - key: auditor
      name: Auditor
      description: Reads requests, grants and the audit trail
      appValue: AUDITOR
  requires:
    identity:
      users:
        # Stored as principal columns, or as principal_attribute rows for department, employeeType and country.
        attributes: [username, email, displayName, department, employeeType, country]
        match: email        # links existing principal rows; Arak keeps its own username
        keeps:              # policy data Arak decides itself; Bancha never sends or overwrites it
          - "principal_attribute: clearance, rls_department, tenant, doctype"
          - db_principal_map
          - LLM, rail and home layout settings
      groups: true          # principal GROUP rows and group_member, written as source 'local' (Arak has no 'bancha' source)
    connections:
      # Bancha owns engine, host, port, database and login; Arak keeps enforcement mode, secure schema, table scope and enabled.
      - types: [postgresql, mssql, mysql]   # the engines Arak's data_source supports
        profiles: [admin]
        reason: Applies GRANT/REVOKE statements on approved requests
      - types: [openmetadata]
        profiles: [read]
        reason: Reads classification tags and table owners
  provides:
    scopes:
      - key: arak:policies.read
        description: Read effective access policies
      - key: arak:requests.write
        description: Create access requests on behalf of a user
  events:
    subscribe: [user.*, group.*, rolebinding.*, connection.*, app.*, sync.*]
    publish: [arak.access.granted, arak.access.revoked]
  delivery:
    mode: adapter
    adapter: arak-admin-api   # server/arak-push.js signs in as bancha-sync and calls /api/v1/principals and /api/v1/sources
  dependsOn: [openmetadata]
